version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates them while
  # keeping the pin, so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # TypeScript MCP server and web app (npm).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: "deps"

  # Python FastMCP server (requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: "deps"
