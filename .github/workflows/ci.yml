name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  node:
    name: node build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts
      - name: Build (tsc, strict) and run the tests against an in-process MQTT broker
        run: npm test

  python:
    name: python lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the CI toolchain (hash-pinned) and the server's dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci.lock
          python -m pip install -r requirements.txt
      - name: Lint (ruff, real errors only)
        # The default rule set flags style in legacy code; E9,F63,F7,F82 are the
        # syntax errors and undefined names that break at runtime.
        run: ruff check --select E9,F63,F7,F82 mqtt_mcp_server.py tests
      - name: Run the FastMCP server tests
        run: pytest -q tests

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=low
      - name: Known vulnerabilities in the Python server's dependencies
        run: pip-audit --strict -r requirements.txt --progress-spinner off
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
